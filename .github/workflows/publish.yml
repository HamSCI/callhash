# Publish to PyPI when a version tag (v*) is pushed.  Uses PyPI trusted
# publishing: PyPI accepts the upload because it comes from this repository's
# workflow, so no API token is stored anywhere.  One-time setup on pypi.org:
# add a (pending) trusted publisher for this repo, workflow publish.yml,
# environment "pypi".
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Tag matches the package version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - run: uv build
      - name: Tests against the built wheel, not the source tree
        run: |
          uv venv /tmp/wheel-venv
          uv pip install -p /tmp/wheel-venv/bin/python "$(ls dist/*.whl)[dev]"
          # src layout: with no pythonpath set, tests import the installed wheel
          /tmp/wheel-venv/bin/python -c "import callhash, sys; assert 'site-packages' in callhash.__file__, callhash.__file__"
          /tmp/wheel-venv/bin/python -m pytest -q tests
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
